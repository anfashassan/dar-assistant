<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haya · Property assistant for DarGlobal &amp; Wasalt</title>
<meta name="description" content="Haya answers questions about DarGlobal's branded residences and finds homes on Wasalt across Saudi Arabia, in English and Arabic.">
<meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111216" media="(prefers-color-scheme: dark)">
<meta property="og:title" content="Haya · Property assistant">
<meta property="og:description" content="Ask about DarGlobal projects or find homes on Wasalt, in English or Arabic.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2316181d'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='34' font-weight='600' fill='%23c9a66b' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E">
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="brand" href="/" aria-label="Haya home">
      <span class="logo" aria-hidden="true">H</span>
      <span class="brand-text">
        <span class="brand-name">Haya <span class="brand-ar">هيا</span></span>
        <span class="brand-tag" data-i18n="tagline">Property assistant · DarGlobal &amp; Wasalt</span>
      </span>
    </a>
    <nav class="top-actions">
      <button class="ghost" id="langToggle" type="button" aria-label="Switch language">ع</button>
      <button class="ghost icon" id="themeToggle" type="button" aria-label="Toggle dark mode"></button>
      <button class="ghost new" id="newChat" type="button"><span class="ic" data-icon="plus"></span><span data-i18n="newChat">New chat</span></button>
    </nav>
  </header>

  <main class="thread" id="thread" aria-live="polite"></main>

  <form class="composer" id="composer" autocomplete="off">
    <div class="composer-box">
      <textarea id="input" rows="1" maxlength="1500" data-i18n-ph="placeholder" placeholder="Ask Haya about a project, a city or a budget…" aria-label="Message"></textarea>
      <button type="button" class="round stop" id="stopBtn" hidden aria-label="Stop"><span class="ic" data-icon="stop"></span></button>
      <button type="submit" class="round send" id="sendBtn" aria-label="Send" disabled><span class="ic" data-icon="send"></span></button>
    </div>
    <p class="disclaimer" data-i18n="disclaimer">Haya can make mistakes. Listing prices come from Wasalt and may have changed. Not financial advice.</p>
  </form>
</div>
<script src="/static/app.js"></script>
</body>
</html>
